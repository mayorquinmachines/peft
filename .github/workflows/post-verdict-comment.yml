name: post-verdict-comment

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Mint Remyx bot token
        id: remyx-bot
        run: |
          token="$(curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.REMYX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"repo\": \"${{ github.repository }}\"}" \
            "https://engine.remyx.ai/api/v1.0/github/installation-token" \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('token', ''))")" || token=""
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          if [ -z "$token" ]; then echo "mint failed"; exit 1; fi

      - name: Post comment as remyx-ai[bot]
        env:
          GH_TOKEN: ${{ steps.remyx-bot.outputs.token }}
        run: |
          cat > body.md <<'REMYX_BODY_EOF'
          ## ✅ Predicted to meet your declared criteria

          `stage: offline-validation` — pre-production evidence, the cheapest rung of the evidence ladder. Production signal, once connected, confirms or overturns this prediction.

          `test_accuracy` (your target metric) measured **0.47** on this PR vs **0.48** on the baseline (pre-change) build — a **-0.01** change, against your ≥ 0.43 threshold.

          | Metric | Goal | `published baseline` | this PR | Δ | Your threshold | |
          |---|---|---|---|---|---|---|
          | `test_accuracy` | higher ↑ | 0.48 | 0.47 | -0.01 | ≥ 0.43 | ✅ |
          | `num_trainable_params` 🛡️ | lower ↓ | 9175040.00 | 4587520.00 | -4587520.00 | ≤ 5100000.00 | ✅ |

          🛡️ guardrail — a metric that must not regress, even if the target improves.

          **Rigor:** a directional signal from a Remyx-synthesized benchmark (`eval/eval_spectral_targeting.py`) — one run per side, single seed, no variance estimate yet. Strengthen it by pointing `suite:` at your own eval harness or an A/B source.

          🔗 [benchmark](https://github.com/mayorquinmachines/peft/blob/4513d719d71bcb46c4e20e2bbd984437bbb36585/eval/eval_spectral_targeting.py)  ·  [criteria](https://github.com/mayorquinmachines/peft/blob/4513d719d71bcb46c4e20e2bbd984437bbb36585/.remyx/validation.yaml)  ·  [commit](https://github.com/mayorquinmachines/peft/commit/4513d719d71bcb46c4e20e2bbd984437bbb36585)

          <details><summary>Raw measurements & run details</summary>

          Run `00000000` · Remyx eval compute · 1 variants × 1 seed

          | variant | commit | `test_accuracy` | `num_trainable_params` |
          |---|---|---|---|
          | feature | `4513d71` | 0.4712 | 4587520.0000 |

          </details>

          _This is a report — the PR's state is unchanged. Enable auto-promote in your project to mark passing PRs ready for review._
          REMYX_BODY_EOF
          gh api repos/${{ github.repository }}/issues/10/comments -F body=@body.md \
            --jq '"posted " + .html_url + " author=" + .user.login'
