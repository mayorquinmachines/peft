# Synthesis config; benchmark below is designed against the repo's published MetaMathQA method-comparison corpus.
model:
  provider: zai

benchmarks:
  - name: ternary-adapt-param-efficiency
    suite: method_comparison/MetaMathQA/eval_ternary_adapt_param_efficiency.py
    scorer: param_ratio_lora_over_ternary
    baseline: main
    metrics:
      # TARGET: LoRA(trainable) / TernaryAdapt(trainable) on identical llama-3.2-3B-shaped q/v projections.
      # Derivation: LoRA r=32 -> q_proj 32*(3072+3072)=196,608, v_proj 32*(3072+1024)=131,072, total 327,680.
      # TernaryAdapt default block shape -> q: block(48,48), A=(64,64)+B=(48,48)=6,400; v: block(32,48),
      # A=(32,64)+B=(32,48)=3,584; total 9,984. Expected ratio 327,680/9,984 ~= 32.8.
      # Threshold 8.0 = "far fewer" (>8x fewer params) with >4x margin under the expected value; baseline emits 0.0.
      - name: param_ratio_lora_over_ternary
        direction: max
        threshold: 8.0
        role: target
      # GUARDRAIL (floor, no-regression): standard LoRA must still fit the seeded surrogate fine-tune task.
      # Teacher is a rank-32 additive delta (a classic LoRA fine-tune), so an untouched LoRA path recovers it
      # near-exactly (~95%+ MSE reduction); 50.0 is a real floor the baseline clears with wide margin, and vetoes
      # any PR-induced breakage of the shared get_peft_model/PeftType-registry path.
      - name: lora_fit_loss_reduction_pct
        direction: max
        threshold: 50.0
        role: guardrail
      # REPORTED (non-gating): TernaryAdapt fit retention on the SAME task, evidence for "without losing fit".
      # Best-ternary-mask argument: approximating W+delta multiplicatively from the ternarized base retains
      # >=~30% of the loss gap in expectation under gaussian weight stats; 20.0 is a modest real bar.
      - name: ternary_fit_loss_reduction_pct
        direction: max
        threshold: 20.0
        role: metric
    policy:
      guardrail_veto: true
    held_constant:
      # from method_comparison/README.md protocol + results corpus filenames (*-llama-3.2-3B-rank32.json):
      - "base projections: llama-3.2-3B shapes q_proj Linear(3072,3072), v_proj Linear(3072,1024), seeded fp32 init, CPU"
      - "target_modules ['q_proj','v_proj'] for both methods; LoRA rank 32 (matches rank32 corpus runs)"
      - "seed 0; batch 16; 150 Adam steps; identical synthetic additive rank-32 fine-tune teacher for both adapters"
      - "trainable params counted via get_peft_model(...).parameters() with requires_grad=True only"
    avoid:
      - "no network / HF Hub downloads (no MetaMathQA training run, no llama-3.2-3B weights); surrogate fit task stands in"
      - "no wall-clock timing (shared CPU); no GPU; deterministic seeds only"
    compute:
      tier: cpu
    provenance:
      param_ratio_lora_over_ternary: "user_guidance + maintainer_comment:@mayorquinmachines"
      lora_fit_loss_reduction_pct: "user_guidance ('without losing fit') as LoRA no-regression; corpus method_comparison/MetaMathQA/results"
      ternary_fit_loss_reduction_pct: "user_guidance ('without losing fit')"
      held_constant: "protocol_doc:method_comparison/README.md + results corpus filenames (llama-3.2-3B, rank32)"
      suite: "synthesized (mirrors repo_runner:method_comparison/MetaMathQA/run.py; anchor tests/regression/test_regression.py style: get_peft_model + trainable-param accounting)"
      compute: "inferred (deterministic CPU param accounting + seeded small-scale fit surrogate)"