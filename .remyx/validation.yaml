benchmarks:
  - suite: "evaluation/eval_memory_savings.py"
    scorer: memory_savings_factor
    baseline: main
    metrics:
      - key: memory_savings_factor
        direction: higher_is_better
        threshold: 1.0
      - key: correct_output
        direction: higher_is_better
        threshold: 1.0
        role: guardrail
    policy: {guardrail_veto: true}
    variants: {feature: {env: {"ENABLE_FACTORED_NORM": "true"}}}
    held_constant:
      - base_model: same
      - seed: same
    avoid:
      - network
    provenance:
      suite: "synthesized"
      scorer: "maintainer_comment:@mayorquinmachines"
      metrics: "maintainer_comment:@mayorquinmachines"
      held_constant: "protocol_doc:method_comparison/README.md"
      avoid: "protocol_doc:method_comparison/README.md"