benchmarks:
  - name: ternary-adapt-param-efficiency
    suite: method_comparison/MetaMathQA/eval_ternary_adapt_param_efficiency.py
    scorer: param_ratio_lora_over_ternary
    baseline: main
    metrics:
      - name: param_ratio_lora_over_ternary
        direction: max
        threshold: 8.0
        role: target
        # Derivation: LoRA r=32 -> q 32*(3072+3072)=196,608 + v 32*(3072+1024)=131,072 = 327,680 trainable.
        # TernaryAdapt default near-square blocks: q (48,48) -> 6,400; v (32,48) -> 3,584; total 9,984.
        # Expected ratio 327,680/9,984 ~= 32.8, so 8.0 sits ~4x under the derivation and 8x above parity;
        # baseline `main` has no ternary tuner and reads 0.0, so only a real implementation clears it.
      - name: lora_fit_loss_reduction_pct
        direction: max
        threshold: 50.0
        role: guardrail
        # Floor on the untouched LoRA path (guardrail_veto): the shared teacher is an exact rank-32 additive
        # delta that LoRA r=32 represents exactly; 150 full-batch Adam steps at lr 1e-2 close most of the MSE
        # gap, and baseline `main` runs the identical LoRA arm and already clears 50.0 — so this only fails
        # if the PR breaks existing tuners (e.g. the dynamic PeftType mutation breaking mapping lookups).
      - name: ternary_fit_loss_reduction_pct
        direction: max
        threshold: 20.0
        role: reported
        # "without losing fit on MetaMathQA" half, report-only: baseline `main` has no ternary tuner and reads
        # 0.0 there, so it cannot be a no-regression guardrail; it gates nothing (guardrail_veto covers LoRA only).
    policy:
      guardrail_veto: true
    held_constant:   # per method_comparison/MetaMathQA/README.md rank32 protocol + the anchor eval script
      - identical fp32 base weights and shapes (llama-3.2-3B attention: q 3072->3072, v 3072->1024), seed 0, torch single thread
      - identical batch-16 inputs and synthetic rank-32 additive teacher (DELTA_STD=0.005) for both adapters
      - same injection entry point (get_peft_model) and same 150-step Adam loop at lr 1e-2 for both adapters
      - LoRA arm fixed at r=32, lora_alpha=32, target q_proj/v_proj (rank32 corpus configuration)
    avoid:
      - wall-clock timing on shared CPU (all metrics are deterministic parameter counts / MSE reductions)
      - unpinned Hub fetches or live APIs (the protocol is an offline deterministic CPU surrogate)
      - GPU/quantized numerics (CUDA nondeterminism; the mechanism is fully CPU-observable)
    compute:
      tier: cpu
    # Feature is default-on (ternarize_base=True, init_weights=True) and the baseline falls back via a
    # defensive import, so no variants/env gating is declared.
    provenance:
      param_ratio_lora_over_ternary: maintainer_comment:@mayorquinmachines
      lora_fit_loss_reduction_pct: maintainer_comment:@mayorquinmachines
      ternary_fit_loss_reduction_pct: user_guidance
      held_constant: protocol_doc:method_comparison/MetaMathQA/README.md
      suite: synthesized