# Validation criteria for kappa-LoRA spectral targeting (condition_number_top_fraction).
#
# Threshold derivation: the benchmark adapts 8 32-dim linear layers with rank-4 LoRA
# (256 trainable params per adapter, 2048 total). Spectral targeting at top_fraction=0.5
# keeps 4 of 8 adapters -> 1024. The 1100 bar sits between the two outcomes.
# The guardrail is a ratio (spectral fit MSE / standard-LoRA fit MSE on the same arm):
# 1.0 = parity; the baseline arm computes exactly 1.0 by construction.
benchmarks:
  - suite: "evaluation/eval_spectral_targeting.py"
    scorer: spectral_lora_trainable_params
    baseline: main
    metrics:
      - key: spectral_lora_trainable_params
        direction: "<="
        threshold: 1100
        role: target
      - key: spectral_lora_fit_mse
        direction: "<="
        threshold: 1.25
        role: guardrail
    policy:
      guardrail_veto: true
    variants:
      feature:
        env:
          LORA_CONDITION_NUMBER_TOP_FRACTION: "0.5"
held_constant:
  - base model (8x 32-dim bias-free linear layers, seeded spectra)
  - LoRA rank (4) and alpha (8)
  - fit protocol (seed 42, full batch, 60 SGD steps)
avoid:
  - no_network
  - no_gpu
  - no_wall_clock_time
provenance:
  spectral_lora_trainable_params: "user_guidance"
  spectral_lora_fit_mse: "user_guidance"
  suite: "synthesized"
  held_constant: "maintainer_tweak"
  avoid: "maintainer_tweak"
