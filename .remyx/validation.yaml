question:
  kind: "parity"
  ask: "does κ-LoRA (top-50% condition-number selection) use far fewer trainable parameters than standard LoRA without losing fit on MetaMathQA?"
model:
  provider: "zai"
loop:
  max_iterations: 8
  fix_code: true
benchmarks:
  - name: "kappa-lora-metamathqa"
    # reviewer (user_guidance): `utils` is the repo's own module at method_comparison/MetaMathQA/utils.py, NOT a pip
    # package. The PyPI `utils` package is removed from the environment (absent from packages: below) and the runner is
    # executed with method_comparison/MetaMathQA as the working directory, so run.py's `import utils` resolves to the
    # local utils.py first on sys.path. packages: installs ONLY the harness's own top-level third-party imports
    # (utils.py does `import datasets` / `import bitsandbytes` unconditionally; peft's core install carries the rest).
    packages: ["datasets", "bitsandbytes"]
    suite:
      harness:
        notebook: .remyx/validations/kappa-lora-metamathqa.ipynb
        runner: "method_comparison/MetaMathQA/run.py"
        experiments: "experiments/kappa-lora/llama-3.2-3B-rank32"
        results_glob: "results/*.json"
        method: "lora"
        smoke:
          params_path: "method_comparison/MetaMathQA/default_training_params.json"
          overrides:
            max_steps: 4
            eval_steps: 2
            max_seq_length: 256
            # batch_size / batch_size_eval are deliberately NOT overridden: the preflight runs at the
            # default_training_params.json batch sizes (reviewer: drop those overrides entirely) and is
            # shortened instead by generation length and eval-sample count, as the preflight asks.
            max_valid_size: 2
            max_test_size: 2
            generation_kwargs:
              max_new_tokens: 8
      scorer: "num_trainable_params"
      metrics:
        - name: "num_trainable_params"
          direction: "min"
          # derivation: standard LoRA row = 28 layers x [32*(3072+3072) for q + 32*(3072+1024) for v] = 9,175,040.
          # Top-28-of-56 selection with k q_proj among the 28 kept = 3,670,016 + 65,536k, spanning 3,670,016 (all-v,
          # 40.0% of the row) to 5,505,024 (all-q, 60.0%); the balanced 14q/14v point is exactly 4,587,520 = half the
          # row. Threshold 1.1 x 4,587,520 = 5,046,272 = exactly 55.0% of the row = the k=21 (21q/7v) count, so it
          # tolerates up to a 21q/7v skew while still proving >= 45% of the row's trainable parameters removed; k=22
          # (5,111,808) fails.
          threshold: 5046272
          role: "target"
          bar: "goal"
          reads_as: "parameters in the injected LoRA adapters; the published standard-LoRA row for this protocol carries 9,175,040"
        - name: "test_accuracy"
          direction: "max"
          # derivation: floor = the published row's own test_accuracy (0.49052312357846856 in
          # lora--llama-3.2-3B-rank32.json) minus a 2pp tolerance band, the repo's working definition of
          # "without losing fit"; it sits strictly inside the row's value, so the baseline row clears it by
          # construction (0.4905... > 0.4705...).
          threshold: 0.47052312357846856
          role: "guardrail"
          bar: "floor"
          reads_as: "accuracy on the MetaMathQA test split under the published protocol; the row being matched scored 0.4905"
        - name: "train_time"
          direction: "min"
          # derivation: ceiling = the row's own train_time (958.3276851720293 s); the paper claims a 16.2% cut, not parity,
          # and the SVD pre-pass adds overhead standard LoRA does not pay.
          threshold: 958.3276851720293
          role: "cost"
          reads_as: "seconds of the fine-tuning loop; the row's own 958.33 s is the ceiling for the paper's -16.2% claim"
        - name: "accelerator_memory_max"
          direction: "min"
          # derivation: ceiling = the row's own accelerator_memory_max (22286434304.0 B); the paper claims a 4.5% cut, not parity.
          threshold: 22286434304.0
          role: "cost"
          reads_as: "peak accelerator bytes during the run; the row's own 22.29 GB is the ceiling for the paper's -4.5% claim"
        - name: "forgetting"
          direction: "min"
          role: "diagnostic"
          reads_as: "the harness's retention metric alongside accuracy; the published standard-LoRA row scored 0.4157"
    policy:
      guardrail_veto: true
    baseline:
      source: "method_comparison/MetaMathQA/results/lora--llama-3.2-3B-rank32.json"
      values:
        # deterministic count: 28 layers x (32x6144 q + 32x4096 v) = 28 x 327,680
        num_trainable_params: 9175040
        # read exactly from the corpus row lora--llama-3.2-3B-rank32.json; the published row is the authority
        test_accuracy: 0.49052312357846856
        train_time: 958.3276851720293
        accelerator_memory_max: 22286434304.0
        forgetting: 0.4156990051269531
    held_constant:
      - "base model meta-llama/Llama-3.2-3B and the default_training_params.json protocol (seed, steps, batch size, max_seq_length, lr schedule) exactly as in the published lora--llama-3.2-3B-rank32 row"
      - "r=32, lora_alpha=64, lora_dropout=0.0 and the same q_proj/v_proj target-module set as the standard LoRA row; condition_number_top_fraction=0.5 is the only intended difference"
    avoid:
      - "changing r, lora_alpha, target_modules, or any training param between the PR config and the compared LoRA row"
      - "substituting a synthetic CPU proxy for the MetaMathQA fit measurement"
      - "unpinned or swapped base-model revisions between runs"
      - "installing the PyPI `utils` package: it would shadow the repo's own method_comparison/MetaMathQA/utils.py that run.py imports — the runner must execute with method_comparison/MetaMathQA as the working directory so the local module wins on sys.path"
    compute:
      tier: "gpu"
      # derivation: the published row's own total_time = 1173.7 s (train 958.3 s + eval/overhead ~215 s) on one GPU;
      # budget = that plus base-model (~6.5 GB) and MetaMathQA download, the 56-svdvals condition-number pre-pass, and
      # a 3x scheduling margin — 7200 s, not the 3-5 h the previous comment assumed.
      timeout_s: 7200
    provenance:
      num_trainable_params: "user_guidance"
      test_accuracy: "user_guidance"
      train_time: "published corpus:method_comparison/MetaMathQA/results/lora--llama-3.2-3B-rank32.json"
      accelerator_memory_max: "published corpus:method_comparison/MetaMathQA/results/lora--llama-3.2-3B-rank32.json"
      forgetting: "published corpus:method_comparison/MetaMathQA/results/lora--llama-3.2-3B-rank32.json"
      suite: "repo_runner:method_comparison/MetaMathQA/run.py"
      packages: "user_guidance"
      held_constant: "protocol_doc:method_comparison/README.md"
      baseline: "published corpus:method_comparison/MetaMathQA/results/lora--llama-3.2-3B-rank32.json"
      timeout_s: "published corpus runtimes"
      smoke: "harness params file:method_comparison/MetaMathQA/default_training_params.json"
report:
  headline: "Top-50% condition-number selection cuts trainable parameters to {num_trainable_params} vs the published row's 9,175,040 while test accuracy holds at {test_accuracy}"
  findings:
    - "{num_trainable_params} trainable parameters vs the published standard-LoRA row's 9,175,040 — a top-28-of-56 condition-number selection, inside the 3,670,016–5,505,024 q/v-skew band"
    - "{test_accuracy} test accuracy vs the published row's 0.4905, holding inside the 2pp no-loss-of-fit band"
    - "{train_time} s of fine-tuning vs the row's 958.33 s ceiling (the paper claims -16.2% net of the SVD pre-pass this PR adds)"
    - "{accelerator_memory_max} B peak accelerator memory vs the row's 22,286,434,304 B ceiling (the paper claims -4.5%)"
    - "{forgetting} on the harness's retention metric vs the published row's 0.4157"
  establishes:
    - "on {num_trainable_params}: restricting LoRA to the top-50% condition-number modules removes at least 45% of standard LoRA's trainable parameters under the published MetaMathQA protocol"
    - "on {test_accuracy}: the selected-subset model still fits MetaMathQA within 2pp of the published standard-LoRA row"
  does_not_establish:
    - "that exactly half the parameters are removed — top-28-of-56 is a module-count statement landing anywhere in a 40–60% band of the row depending on the realized q/v skew"
    - "the paper's cross-benchmark averages (-16.2% time, -4.5% memory): this is one task, one base model, one run"
    - "that condition numbers of the selected matrices decrease over training (the paper's spectral-rebalancing analysis)"
  not_measured:
    - "the condition-number trajectories over training"
    - "the SVD pre-pass cost in isolation (only visible folded into train_time/total_time)"
    - "inference latency or on-device deployment cost"
  caveat: "The PR ranks the frozen base weights' condition numbers as a proxy for the paper's spectral criterion and pays a 56-svdvals pre-pass standard LoRA does not, so time parity is not guaranteed."
  next: "Instrument the 56 condition numbers and the pre-pass time separately to show which modules were selected and what the ranking costs."
