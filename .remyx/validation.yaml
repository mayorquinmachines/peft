# Validation via the repo's OWN benchmark: method_comparison/MetaMathQA — the
# harness, protocol (Llama-3.2-3B, rank 32, 5000 steps), and metrics that peft
# maintainers publish results for. The baseline is the repo's published
# standard-LoRA result, so no baseline arm runs: this PR's arm is compared
# against numbers the maintainers computed themselves.
#
# Thresholds: published standard LoRA reaches test_accuracy 0.4784 with
# 9,175,040 trainable params. The claim under test is "half the params without
# losing accuracy": accuracy must stay within a 0.05 band of published, and the
# param count must actually come in at roughly half (<= 55% of published).
benchmarks:
  - suite: "eval/run_kappa_method_comparison.py"
    scorer: test_accuracy
    baseline:
      source: "method_comparison/MetaMathQA/results/lora--llama-3.2-3B-rank32.json"
      values:
        test_accuracy: 0.4784
        num_trainable_params: 9175040
    metrics:
      - key: test_accuracy
        direction: ">="
        threshold: 0.43
        role: target
      - key: num_trainable_params
        direction: "<="
        threshold: 5100000
        role: guardrail
      - key: peak_vram_gb
        role: cost
      - key: train_time_s
        role: cost
    policy:
      guardrail_veto: true
compute:
  tier: gpu
  gpu: true
  timeout_s: 10800
held_constant:
  - model (meta-llama/Llama-3.2-3B) and dataset (MetaMathQA)
  - protocol (default_training_params.json - 5000 steps, seed 0)
  - LoRA rank (32) and alpha (64)
avoid:
  - no_protocol_changes_vs_published_runs
provenance:
  suite: "repo_runner:method_comparison/MetaMathQA"
  baseline: "repo_results:lora--llama-3.2-3B-rank32.json"
  test_accuracy: "user_guidance"
  num_trainable_params: "user_guidance"
